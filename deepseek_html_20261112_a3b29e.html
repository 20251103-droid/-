<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青春果漾 · 首頁</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Font Awesome 用於圖示 (青春風格小點綴) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-seedling"></i>
            <span>青春果漾</span>
        </div>
        <nav class="navbar">
            <a href="index.html" class="active">首頁</a>
            <a href="products.html">產品介紹</a>
            <a href="contact.html">聯絡我們</a>
        </nav>
    </header>

    <main>
        <!-- 圖片輪播區塊 -->
        <section class="carousel-section">
            <div class="carousel-container">
                <div class="carousel-slide">
                    <img src="https://picsum.photos/id/1060/1200/500?grayscale&blur=1" alt="青春活力 1">
                    <img src="https://picsum.photos/id/1043/1200/500?grayscale&blur=1" alt="青春活力 2">
                    <img src="https://picsum.photos/id/1059/1200/500?grayscale&blur=1" alt="青春活力 3">
                </div>
                <button class="carousel-btn prev" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                <button class="carousel-btn next" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
                <div class="carousel-dots" id="dotsContainer"></div>
            </div>
        </section>

        <!-- 首頁標語與簡介 -->
        <section class="hero-text">
            <h1>青春，就要<span class="highlight">果漾</span>！</h1>
            <p>全新鮮果風味，讓你的每一天都充滿活力與朝氣。<br>快來體驗最青春的味道！</p>
            <a href="products.html" class="cta-button">探索產品 <i class="fas fa-arrow-right"></i></a>
        </section>

        <!-- 特色亮點 -->
        <section class="features">
            <div class="feature-item">
                <i class="fas fa-heart"></i>
                <h3>青春配方</h3>
                <p>天然水果萃取，無負擔的甜蜜滋味。</p>
            </div>
            <div class="feature-item">
                <i class="fas fa-bolt"></i>
                <h3>活力滿分</h3>
                <p>維他命C滿滿，隨時補充能量。</p>
            </div>
            <div class="feature-item">
                <i class="fas fa-recycle"></i>
                <h3>永續包裝</h3>
                <p>環保材質，愛地球也愛自己。</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2025 青春果漾 · 讓每一天都青春洋溢</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
