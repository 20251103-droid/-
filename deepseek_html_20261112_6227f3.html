<!-- products.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青春果漾 · 產品介紹</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-seedling"></i>
            <span>青春果漾</span>
        </div>
        <nav class="navbar">
            <a href="index.html">首頁</a>
            <a href="products.html" class="active">產品介紹</a>
            <a href="contact.html">聯絡我們</a>
        </nav>
    </header>

    <main class="products-main">
        <h1 class="page-title">人氣商品 <i class="fas fa-star"></i></h1>
        <p class="page-subtitle">青春就是要繽紛多彩，快來挑選你的專屬風味！</p>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://picsum.photos/id/1080/400/300" alt="草莓青春飲">
                <h2>草莓青春飲</h2>
                <p class="price">NT$ 45</p>
                <p>酸甜草莓與氣泡的完美結合，初戀般的滋味。</p>
                <button class="buy-btn">加入購物車 <i class="fas fa-cart-plus"></i></button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/id/106/400/300" alt="芒果活力飲">
                <h2>芒果活力飲</h2>
                <p class="price">NT$ 45</p>
                <p>濃郁芒果香，搭配QQ果粒，活力滿點。</p>
                <button class="buy-btn">加入購物車 <i class="fas fa-cart-plus"></i></button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/id/75/400/300" alt="藍莓優格飲">
                <h2>藍莓優格飲</h2>
                <p class="price">NT$ 50</p>
                <p>藍莓與優格的滑順口感，青春無敵。</p>
                <button class="buy-btn">加入購物車 <i class="fas fa-cart-plus"></i></button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/id/292/400/300" alt="奇異果輕飲">
                <h2>奇異果輕飲</h2>
                <p class="price">NT$ 45</p>
                <p>清爽奇異果，低卡輕盈，青春不設限。</p>
                <button class="buy-btn">加入購物車 <i class="fas fa-cart-plus"></i></button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 青春果漾 · 讓每一天都青春洋溢</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
