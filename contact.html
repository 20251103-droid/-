<!-- contact.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青春果漾 · 聯絡我們</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-seedling"></i>
            <span>青春果漾</span>
        </div>
        <nav class="navbar">
            <a href="index.html">首頁</a>
            <a href="products.html">產品介紹</a>
            <a href="contact.html" class="active">聯絡我們</a>
        </nav>
    </header>

    <main class="contact-main">
        <h1 class="page-title">與我們聯絡 <i class="fas fa-paper-plane"></i></h1>
        <p class="page-subtitle">有任何問題或合作想法，都歡迎告訴我們！</p>

        <div class="contact-container">
            <div class="contact-info">
                <h2>青春果漾工作室</h2>
                <p><i class="fas fa-map-marker-alt"></i> 台北市青春路一段100號</p>
                <p><i class="fas fa-phone"></i> (02) 1234-5678</p>
                <p><i class="fas fa-envelope"></i> hello@youthfruit.com</p>
                <p><i class="fas fa-clock"></i> 週一至週五 09:00 - 18:00</p>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-line"></i></a>
                </div>
            </div>
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" placeholder="你的名字" required>
                </div>
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">訊息</label>
                    <textarea id="message" rows="5" placeholder="想說的話..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">送出訊息 <i class="fas fa-arrow-right"></i></button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 青春果漾 · 讓每一天都青春洋溢</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
